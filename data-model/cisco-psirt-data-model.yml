observations:
  - >-
    NO $ref relationships exist between the response schemas. Every entity is a
    flat bag of scalars; the graph above is reconstructed entirely from identifier
    fields and from which endpoint accepts which identifier.
  - >-
    Multi-valued fields (cves, bugIDs, cwe, productNames) are typed as plain
    "string" with a single-value example, so a naive code generator will produce a
    String where the wire actually carries a comma-joined list. This is the single
    most likely integration bug against this API.
  - >-
    summary contains raw HTML with authoring-tool artefacts (mce-annotation spans)
    visible in Cisco's own published example. Sanitise before rendering.
  - >-
    The richest representation of an advisory is NOT in this API — it is the CSAF
    document at csafUrl. The API is best used as an index over the CSAF corpus at
    https://www.cisco.com/.well-known/csaf/.
