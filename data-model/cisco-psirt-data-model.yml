      - {name: nos_version, type: string, example: '7.0(3)F1(1)'}
      - {name: platform_name, type: string, example: Cisco Nexus 9000 Series Switches}
    accessed_by: ['GET /OS_version/OS_data', 'GET /nos_version/nos_data']
  - name: PlatformAlias
    schema: PlatformData
    primary_key: id
    description: A platform grouping used to narrow an OS-version query.
    fields:
      - {name: id, type: integer, example: 265086}
      - {name: platformAlias, type: string, example: MDS9000}
      - {name: name, type: string, example: Cisco MDS 9000 Multilayer Directors and Fabric Switches}
    accessed_by: ['GET /platforms']
  - name: OSType
    schema: OSTypes
    description: Controlled vocabulary of the network operating systems the API can be queried against.
