description: >-
  A small, flat, denormalised model. The openVuln API has exactly one first-class
  entity — the Advisory — and three lookup entities that exist to make software-
  version queries possible (OS type, OS version, platform alias). There are no
  nested objects and no $ref relationships between the response schemas: every
  cross-entity link is carried as a STRING, and often as a comma-joined string
  rather than an array. That is the defining characteristic of this data model and
  the main friction for an agent consuming it.
entities:
  - name: Advisory
    schema: Advisories
    primary_key: advisoryId
    id_format: cisco-sa-XXX
    id_examples: ['cisco-sa-lsplus-Z6AQEOjk', 'cisco-sa-20180221-ucdm']
    description: A published Cisco security advisory. The only real resource in the API.
    fields:
      - {name: advisoryId, type: string, role: identifier}
      - {name: advisoryTitle, type: string}
      - {name: bugIDs, type: string, role: foreign-identifier, target: CiscoBug, cardinality: many, note: 'Comma-joined string, not an array.'}
      - {name: cves, type: string, role: foreign-identifier, target: CVE, cardinality: many, note: 'Comma-joined string, not an array.'}
      - {name: cwe, type: string, role: foreign-identifier, target: CWE, cardinality: many}
      - {name: ipsSignatures, type: string, note: 'NA when absent.'}
      - {name: cvssBaseScore, type: number, role: metric, standard: CVSS}
      - {name: sir, type: string, role: classification, standard: Cisco Security Impact Rating, values: [Critical, High, Medium, Low, Informational]}
      - {name: status, type: string, example: Final}
      - {name: version, type: number, role: revision, example: 1.1}
      - {name: firstPublished, type: string, format: date-time, timezone: UTC}
      - {name: lastUpdated, type: string, format: date-time, timezone: UTC}
      - {name: productNames, type: string, cardinality: many, note: 'Gated behind the productNames=true query parameter.'}
      - {name: summary, type: string, format: html, note: 'Gated behind summaryDetails=true. Contains raw HTML, including editorial markup left over from Cisco''s authoring tool.'}
      - {name: publicationUrl, type: string, format: uri, target: tools.cisco.com advisory page}
      - {name: cvrfUrl, type: string, format: uri, target: CVRF XML document, status: retiring}
      - {name: csafUrl, type: string, format: uri, target: CSAF JSON document, status: preferred}
    accessed_by:
      - 'GET /advisory/{advisoryId}'
      - 'GET /cve/{cve_id}'
      - 'GET /bugid/{bug_id}'
      - 'GET /all'
      - 'GET /latest/{number}'
      - 'GET /severity/{severity}'
      - 'GET /year/{year}'
      - 'GET /product'
      - 'GET /ios, /iosxe, /aci, /nxos'
  - name: OSVersionQuery
    schema: OSData
    description: >-
      The answer to "which advisories affect this exact software release" — the
      Cisco Software Checker integration surfaced through the API.
    fields:
