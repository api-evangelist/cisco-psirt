  requested extension. There is no type URI, no title/detail/instance, no
  problem+json media type. The errorCode string, not the HTTP status, is the field
  an agent must branch on: 404 alone is ambiguous across six distinct causes.
envelope:
  media_types: [application/json, application/xml]
  fields:
    errorCode: A screaming-snake-case machine token, e.g. ADVISORYID_NOT_FOUND.
    errorMessage: A human sentence, not stable enough to parse.
  example_json: '{"errorCode": "ADVISORYID_NOT_FOUND", "errorMessage": "Advisory-id not found"}'
  example_xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <advisory>
      <errorCode>ADVISORYID_NOT_FOUND</errorCode>
      <errorMessage>Advisory-id not found</errorMessage>
    </advisory>
