method: searched
source: >-
  Live probes of the /.well-known/ discovery surface on every host that carries
  this API: the two OpenAPI servers[] hosts (api.cisco.com, apix.cisco.com), the
  developer portal / docs host (developer.cisco.com), and the corporate root
  (www.cisco.com) that the openVuln API's own security.txt Canonical field names.
description: >-
  Cisco serves a real, PGP-signed RFC 9116 security.txt at the corporate root and
  — unusually — a CSAF (Common Security Advisory Framework) provider-metadata.json
  under /.well-known/csaf/. The CSAF document is directly relevant to this API:
  the openVuln API returns CSAF/CVRF location data for every advisory, so the
  well-known CSAF directory is the bulk-download twin of the API.
hosts:
  - host: https://www.cisco.com
    note: >-
      Corporate root. The security.txt here is the canonical one for Cisco PSIRT
      (its own Canonical: field points back at this URL) and its Contact is
      psirt@cisco.com — the team that operates this API.
    documents:
      - path: /.well-known/security.txt
        status: 200
        content_type: text/plain
        file: cisco-psirt-security.txt
        note: RFC 9116, PGP clear-signed, Expires 2027-01-01.
      - path: /.well-known/csaf/provider-metadata.json
        status: 200
        content_type: application/json
        file: cisco-psirt-csaf-provider-metadata.json
        note: >-
          CSAF 2.0 provider metadata; role csaf_trusted_provider, publisher
          "Cisco PSIRT", distribution directory https://www.cisco.com/.well-known/csaf/.
      - path: /.well-known/agent-card.json
        status: 404
      - path: /.well-known/agent.json
        status: 404
      - path: /.well-known/api-catalog
