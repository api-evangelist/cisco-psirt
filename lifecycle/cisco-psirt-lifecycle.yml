generated: '2026-08-19'
method: searched
source: >-
  https://developer.cisco.com/docs/psirt/ (Introduction + Authentication) and the
  Cisco-published OpenAPI at
  https://github.com/CiscoPSIRT/openVulnAPI/blob/master/swagger/openVulnAPIOAS_3_0_3.yaml
description: >-
  The openVuln API's lifecycle posture is unusual and worth reading carefully: Cisco
  encodes deprecation IN THE CONTRACT rather than only in prose. The published
  OpenAPI carries three tags — Current Endpoints, Sunset Endpoints and Obsolete
  Endpoints — and every obsolete operation is marked deprecated:true with a 410 Gone
  as its only documented response. That is a machine-readable retirement signal an
  agent can act on without reading a policy page. What Cisco does NOT publish is a
  dated changelog, a versioning policy page, an SLA, or a status page for this API.
versioning:
  scheme: uri-path-basepath
  current: security/advisories/v2
  previous: security/advisories
  spec_version: 2.0.2
  mechanism: >-
    The version lives in the server basePath variable, which the OpenAPI declares
    as an enum of exactly two values: "security/advisories" (v1, legacy) and
    "security/advisories/v2" (current, default). There is no version header and no
    date-pinned version train.
  docs: https://developer.cisco.com/docs/psirt/
  policy_page: null
deprecation:
  policy_url: null
  policy_page_published: false
  in_contract: true
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    OpenAPI-native. Obsolete operations carry deprecated:true and document 410 Gone
    as their only response. Sunset operations are grouped under a "Sunset Endpoints"
    tag whose description states the migration requirement verbatim: 'The
    "security/advisories" basepath will be deprecated in the future. These API
    endpoints have changed with the introduction of v2 basepath. Migrate the below
    endpoints to current endpoint calls. The below endpoints only work with
    "security/advisories" basepath.' RFC 8594 Sunset / Deprecation response headers
    are NOT used.
  announced_retirements:
    - subject: CVRF advisory format
      detail: >-
        "Cisco recommends focusing on CSAF as CVRF will be phased out for Cisco
        advisories. ... Cisco will support CVRF until December 31, 2023."
      date: '2023-12-31'
      source: https://developer.cisco.com/docs/psirt/
      replacement: CSAF (Common Security Advisory Framework)
    - subject: api.cisco.com host for pre-March-2023 applications
      detail: >-
        The OpenAPI's own server description reads "OpenVuln API - Applications
        created prior March 1, 2023; expires Sep 30, 2023". Applications registered
        after March 2023 use apix.cisco.com.
      date: '2023-09-30'
      source: openapi/_original/cisco-psirt-openvuln-openapi.json
      replacement: https://apix.cisco.com/security/advisories/v2
    - subject: registered applications on the legacy API console
      detail: >-
        "IMPORTANT: Current registered applications will be deprecated in coming
        months. Please migrate your applications to continue using API's."
      date: null
      source: https://developer.cisco.com/docs/psirt/authentication/
  application_lifecycle: >-
    Cisco reserves the right to remove End-of-Support software releases from the
    Cisco Software Checker, which is subsequently reflected in this API's
    version/platform responses.
