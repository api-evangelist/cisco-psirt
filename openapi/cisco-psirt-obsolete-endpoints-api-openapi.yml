  /cvrf/cve/{cve_id}:
    get:
      description: Used to obtain an advisory using a given Common Vulnerability Enumerator (CVE). The `cve_id` format is CVE-YYYY-NNNN. For more information about CVE visit http://cve.mitre.org/
      deprecated: true
      tags:
