        required: false
        schema:
          type: boolean
      - name: startDate
        description: Format example Year-Month-Day 2022-05-12
        in: query
        required: true
        schema:
          type: string
          format: string
          pattern: ^\d{4}\-(0[1-9]|1[012])\-(0[1-9]|[12][0-9]|3[01])$
      - name: endDate
