components:
  schemas:
    EndofLife:
      description: And End of Life endpoint.  Migrate your code to latest API endpoint.
      properties:
        errorCode:
          type: string
          example: URI_NOT_AVAILABLE
        errorMessage:
          type: string
          example: URI_CONTAINING(/CVRF/)_IS_NO_LONGER_AVAILABLE
  securitySchemes:
    psirt_openvuln_api_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
