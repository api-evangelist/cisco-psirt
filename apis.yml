aid: cisco-psirt
name: Cisco PSIRT openVuln API
description: The Cisco Product Security Incident Response Team (PSIRT) openVuln API is Cisco's machine-readable
  vulnerability disclosure service. It lets security teams query Cisco security advisories by CVE, advisory ID,
  severity, publication date, affected product or specific IOS/IOS-XE release, and returns CVRF and OVAL content
  alongside JSON. It is one of the few Cisco surfaces with a genuinely public, fetchable OpenAPI 3.0.3 document,
  published in the CiscoPSIRT GitHub organization.
