certification_note: >-
  These are the frameworks the Trust Portal names verbatim in its own document
  categories — "Audit Reports (SOC, FedRAMP, ISO, C5)" and Trust Packages
  containing "SOC2/ISO 27001 Certification" and "Privacy Data Sheet/Maps (GDPR)".
